<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2팀 허들</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <style>
    /* 허들 — 조장만 수정. 작업실과 같은 데이터를 둥근 테이블로 보여줌 */
    body { font-family: var(--font-pixel); color: var(--pixel-white);
      background: var(--pixel-ink) radial-gradient(color-mix(in srgb, var(--pixel-white) 14%, transparent) 1px, transparent 1.5px) 0 0 / 24px 24px; }
    .top { max-width: 1180px; margin: 0 auto; padding: var(--space-4) var(--space-3) var(--space-3);
      display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; justify-content: space-between; }
    .top h1 { margin: 0; font-size: var(--text-xl); }
    .top p { margin: var(--space-1) 0 0; color: var(--status-rest); font-size: var(--text-sm); }
    .nav { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .chip { display: inline-block; padding: 6px 12px; border: 2px solid var(--pixel-white); color: var(--pixel-white);
      text-decoration: none; font-size: var(--text-sm); box-shadow: 3px 3px 0 var(--pixel-color-8); }
    .chip.on { background: var(--pixel-white); color: var(--pixel-ink); }

    .layout { max-width: 1180px; margin: 0 auto; padding: 0 var(--space-3) var(--space-5);
      display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--space-4); align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    .ring { --char: clamp(36px, 7.5vw, 72px); position: relative; width: 100%; max-width: 760px; aspect-ratio: 1; margin: 0 auto; }
    .lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .lines .done { stroke: var(--pixel-floor-2); opacity: .35; }
    .lines .wait { stroke: var(--status-work); stroke-dasharray: 1.2 1.2; animation: flow 1s linear infinite; }
    .lines .wait.long { stroke: var(--status-stuck); }
    @keyframes flow { to { stroke-dashoffset: -2.4; } }

    .table { position: absolute; left: 50%; top: 50%; width: 42%; aspect-ratio: 1; transform: translate(-50%, -50%);
      border-radius: 50%; background: var(--pixel-desk); border: 6px solid var(--pixel-desk-dark);
      box-shadow: 0 0 0 6px var(--pixel-ink), 0 0 0 10px var(--pixel-desk-dark); display: grid; place-items: center; }
    .table-in { width: 72%; display: grid; gap: 8px; justify-items: center; text-align: center; color: var(--pixel-ink); }
    .table-in .label { font-size: clamp(11px, 1.6vw, 14px); }
    .table-in .label b { font-size: clamp(16px, 3vw, 26px); display: block; }
    .mosaic { display: grid; grid-template-columns: repeat(var(--cols, 6), 1fr); gap: 3px; width: 100%; }
    .tile { aspect-ratio: 1; border: 2px solid var(--pixel-ink); animation: pop .4s steps(3); }
    .tile.pending { background: transparent !important; border-style: dashed; animation: blink 1.2s steps(2) infinite; }
    @keyframes pop { from { transform: scale(.2); } }
    @keyframes blink { 50% { opacity: .35; } }
    .table-in .none { font-size: 12px; color: var(--pixel-desk-dark); }

    .seat { position: absolute; transform: translate(-50%, -50%); width: clamp(84px, 17%, 150px);
      display: flex; flex-direction: column; align-items: center; gap: 4px; color: inherit; text-decoration: none; }
    .seat.below .bubble { order: 9; }
    .bubble { max-width: 100%; background: var(--pixel-white); color: var(--pixel-ink); border: 2px solid var(--pixel-ink);
      padding: 3px 6px; font-size: clamp(10px, 1.4vw, 12px); line-height: 1.35; text-align: center; overflow-wrap: anywhere; }
    .is-stuck .bubble { background: var(--status-stuck); color: var(--pixel-white); animation: shake .5s steps(2) infinite; }
    @keyframes shake { 50% { transform: translateX(3px); } }
    .body { position: relative; }
    .char { width: var(--char); height: var(--char); image-rendering: pixelated; animation: bob 1.2s steps(2) infinite; display: block; }
    .is-rest .char { animation-duration: 3s; }
    @keyframes bob { 50% { transform: translateY(-3px); } }
    .is-ghost .char { animation: none; opacity: .5; }
    .orbit { position: absolute; inset: 0; pointer-events: none; }
    .orbit canvas { position: absolute; width: calc(var(--char) * .34); height: calc(var(--char) * .34); image-rendering: pixelated; animation: float 2s steps(3) infinite; }
    .orbit canvas:nth-child(1) { left: -42%; top: 18%; }
    .orbit canvas:nth-child(2) { right: -42%; top: 18%; animation-delay: .6s; }
    .orbit canvas:nth-child(3) { left: -42%; top: 62%; animation-delay: 1.2s; }
    @keyframes float { 50% { transform: translateY(-4px); } }
    .name { display: flex; align-items: center; gap: 5px; font-size: clamp(11px, 1.5vw, 14px); white-space: nowrap; }
    .dot { width: 8px; height: 8px; background: var(--status-rest); flex: none; }
    .is-work .dot { background: var(--status-work); }
    .is-stuck .dot { background: var(--status-stuck); }
    .is-done .dot { background: var(--status-done); }
    .sub { font-size: 11px; color: var(--status-rest); text-align: center; }
    .is-empty { opacity: .45; }
    .chair { width: var(--char); height: calc(var(--char) * .55); border: 2px dashed var(--status-rest); }

    .paper { position: absolute; transform: translate(-50%, -50%); background: var(--pixel-white); color: var(--pixel-ink);
      border: 2px solid var(--pixel-ink); padding: 1px 5px; font-size: 11px; white-space: nowrap; pointer-events: none; }
    .paper.long { background: var(--status-stuck); color: var(--pixel-white); }

    @media (max-width: 560px) {
      .sub, .paper { display: none; }
      .ring { --char: 40px; }
      .bubble { font-size: 10px; padding: 2px 4px; }
    }
    .side { display: grid; gap: var(--space-3); }
    .box { border: 2px solid var(--pixel-white); padding: var(--space-3); box-shadow: 4px 4px 0 var(--pixel-color-8); }
    .box h2 { margin: 0 0 var(--space-2); font-size: var(--text-md); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat span { display: block; font-size: 11px; color: var(--status-rest); }
    .stat b { font-size: var(--text-lg); }
    .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; line-height: 1.45; }
    .log time { color: var(--status-rest); margin-right: 6px; }
    .tag { font-size: 10px; padding: 0 4px; margin-left: 4px; background: var(--status-work); color: var(--pixel-ink); }
    .how { font-size: 12px; color: var(--status-rest); line-height: 1.6; margin: 0; padding-left: 16px; }
    .error { color: var(--status-stuck); font-size: 12px; }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>2팀 허들</h1>
      <p id="sub">둘러앉아 각자 만들고, 가운데로 모아요</p>
    </div>
    <nav class="nav">
      <a class="chip" href="index.html" id="to-room">작업실</a>
      <a class="chip on" href="huddle.html" id="to-self">허들</a>
      <a class="chip" href="process.html" id="to-flow">오늘의 흐름</a>
      <a class="chip" href="huddle.html?demo" id="to-demo">예시 보기</a>
    </nav>
  </header>

  <main class="layout">
    <section class="ring" id="ring">
      <svg class="lines" id="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="table"><div class="table-in" id="table"></div></div>
    </section>

    <aside class="side">
      <div class="box"><h2>지금</h2><div class="stats" id="stats"></div></div>
      <div class="box"><h2>방금 일어난 일</h2><ul class="log" id="log"></ul></div>
      <div class="box"><h2>읽는 법</h2>
        <ul class="how">
          <li>가운데 테이블 = main. 칸 하나 = merge된 PR 하나, 색 = 올린 사람</li>
          <li>점선 칸 = 아직 merge를 기다리는 PR</li>
          <li>움직이는 점선 = 테이블로 가는 중인 PR, 20분 넘으면 빨강</li>
          <li>희미한 선 = 이미 합쳐진 작업이 있는 사람</li>
          <li>캐릭터 옆에 떠 있는 로봇 = 그 사람의 에이전트</li>
        </ul>
      </div>
      <p class="error" id="note"></p>
    </aside>
  </main>

  <script src="shared/pixel.js"></script>
  <script>
    const STATUS = { "작업 중": "is-work", "막힘": "is-stuck", "완료": "is-done", "쉬는 중": "is-rest" };
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const hm = (d) => d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
    const mins = (a, b) => Math.max(0, Math.round((b - a) / 60000));
    const colorVar = (me) => `var(--pixel-color-${(me && Number.isInteger(me.color) && me.color >= 1 && me.color <= 8) ? me.color : 8})`;
    const pt = (i, n, r) => { const a = (-90 + (360 / n) * i) * Math.PI / 180; return { x: 50 + r * Math.cos(a), y: 50 + r * Math.sin(a) }; };
    let last = null;

    async function render() {
      const demo = PIXEL.isDemo();
      const q = demo ? "?demo" : "";
      document.getElementById("to-room").href = `index.html${q}`;
      document.getElementById("to-flow").href = `process.html${q}`;
      const d = document.getElementById("to-demo");
      d.textContent = demo ? "지금 보기" : "예시 보기";
      d.href = demo ? "huddle.html" : "huddle.html?demo";

      let room, flow;
      try {
        room = await PIXEL.loadRoom("", demo);
        try { flow = await PIXEL.loadFlow(room.repo, demo); document.getElementById("note").textContent = ""; }
        catch (e) { document.getElementById("note").textContent = e.message; flow = last ? last.flow : { now: new Date().toISOString(), commits: [], pulls: [] }; }
        last = { room, flow };
      } catch (e) {
        document.getElementById("note").textContent = "데이터를 불러오지 못했어요. 배포 주소나 로컬 서버로 열어주세요.";
        return;
      }

      const now = new Date(flow.now);
      const isToday = (iso) => new Date(iso).toDateString() === now.toDateString();
      let { commits, pulls } = flow;
      if (commits.some((c) => isToday(c.at)) || pulls.some((p) => isToday(p.created_at))) {
        commits = commits.filter((c) => isToday(c.at));
        pulls = pulls.filter((p) => isToday(p.created_at) || (p.merged_at && isToday(p.merged_at)));
      }
      const L = (s) => String(s).toLowerCase();
      const meOf = Object.fromEntries(room.seats.filter((s) => s.id).map((s) => [L(s.id), s.me]));
      const nameOf = (login) => (meOf[L(login)] && meOf[L(login)].name) || login;
      const merged = pulls.filter((p) => p.merged_at).sort((a, b) => new Date(a.merged_at) - new Date(b.merged_at));
      const open = pulls.filter((p) => !p.merged_at && p.state !== "closed");

      // 가운데 테이블: merge된 PR 모자이크
      const tiles = [
        ...merged.map((p) => `<span class="tile" title="#${p.number} ${esc(p.title)} · ${esc(nameOf(p.login))}" style="background:${colorVar(meOf[L(p.login)])}"></span>`),
        ...open.map((p) => `<span class="tile pending" title="#${p.number} 대기 중 · ${esc(nameOf(p.login))}" style="border-color:${colorVar(meOf[L(p.login)])}"></span>`)
      ];
      const cols = tiles.length > 36 ? 8 : 6;
      document.getElementById("table").innerHTML = `<div class="label"><b>main</b>합쳐진 작업 ${merged.length}개</div>` +
        (tiles.length ? `<div class="mosaic" style="--cols:${cols}">${tiles.join("")}</div>` : `<div class="none">아직 합쳐진 작업이 없어요<br>첫 PR이 merge되면 여기에 칸이 생겨요</div>`);

      // 자리 · 선 · 서류
      const ring = document.getElementById("ring");
      ring.querySelectorAll(".seat, .paper").forEach((el) => el.remove());
      const n = room.seats.length;
      let svg = "";
      room.seats.forEach((seat, i) => {
        const p = pt(i, n, 40);
        const el = document.createElement(seat.me ? "a" : "div");
        el.style.left = `${p.x}%`; el.style.top = `${p.y}%`;
        const below = p.y > 50.5;
        if (!seat.id) {
          el.className = "seat is-empty";
          el.innerHTML = `<div class="chair"></div><div class="sub">빈자리</div>`;
        } else if (!seat.me) {
          el.className = `seat is-ghost${below ? " below" : ""}`;
          el.innerHTML = `<div class="bubble">아직 출근 전</div><div class="body"><canvas class="char"></canvas></div>
            <div class="name"><span class="dot"></span>${esc(seat.id)}</div><div class="sub">me.json을 올리면 앉아요</div>`;
        } else {
          const me = seat.me;
          el.className = `seat ${STATUS[me.status] || "is-rest"}${below ? " below" : ""}`;
          el.href = `features/${seat.id}/`;
          const agents = (me.agents || []).slice(0, 3).map((a, k) => `<canvas data-agent="${k}" title="${esc(a.name)}${a.says ? " · " + esc(a.says) : ""}"></canvas>`).join("");
          el.innerHTML = `<div class="bubble">${esc(me.says || me.status || "")}</div>
            <div class="body"><canvas class="char"></canvas>${agents ? `<div class="orbit">${agents}</div>` : ""}</div>
            <div class="name"><span class="dot"></span>${esc(me.name || seat.id)}</div>
            <div class="sub">${esc(me.role || "")}${(me.agents || []).length ? ` · 에이전트 ${me.agents.length}` : ""}</div>`;
        }
        ring.appendChild(el);
        const c = el.querySelector("canvas.char");
        if (c) PIXEL.draw(c, PIXEL.spriteOf(seat.me).rows, PIXEL.colorsFor(seat.me), 6, !seat.me);
        el.querySelectorAll("canvas[data-agent]").forEach((ac) => PIXEL.draw(ac, PIXEL.AGENT_SPRITE, PIXEL.colorsFor(seat.me), 3));

        if (!seat.id) return;
        const a = pt(i, n, 30), b = pt(i, n, 22);
        const mine = merged.filter((x) => L(x.login) === L(seat.id)).length;
        if (mine) svg += `<line class="done" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${Math.min(0.4 + mine * 0.35, 2)}" />`;
        const waiting = open.filter((x) => L(x.login) === L(seat.id));
        if (waiting.length) {
          const longest = Math.max(...waiting.map((x) => mins(new Date(x.created_at), now)));
          svg += `<line class="wait ${longest >= 20 ? "long" : ""}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width=".6" />`;
          const m = pt(i, n, 26), paper = document.createElement("span");
          paper.className = `paper ${longest >= 20 ? "long" : ""}`;
          paper.style.left = `${m.x}%`; paper.style.top = `${m.y}%`;
          paper.textContent = `PR ${waiting.length} · ${longest}분`;
          ring.appendChild(paper);
        }
      });
      document.getElementById("lines").innerHTML = svg;

      // 옆 패널
      const seated = room.seats.filter((s) => s.me);
      const ai = commits.filter((c) => c.claude).length;
      const agentsN = seated.reduce((k, s) => k + (s.me.agents || []).length, 0);
      document.getElementById("stats").innerHTML = [
        ["앉은 사람", `${seated.length}/${n}`], ["합쳐진 작업", merged.length],
        ["가는 중인 PR", open.length], ["막힘", seated.filter((s) => s.me.status === "막힘").length],
        ["Claude 동행", commits.length ? `${Math.round((ai / commits.length) * 100)}%` : "-"], ["에이전트", agentsN]
      ].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("");

      const ev = [
        ...commits.map((c) => ({ t: c.at, h: `${esc(nameOf(c.login))} 커밋${c.claude ? `<span class="tag">Claude</span>` : ""}` })),
        ...pulls.map((p) => ({ t: p.created_at, h: `${esc(nameOf(p.login))} PR #${p.number} 올림` })),
        ...merged.map((p) => ({ t: p.merged_at, h: `#${p.number} merge → 테이블에 ${esc(nameOf(p.login))}의 칸` }))
      ].sort((a, b) => new Date(b.t) - new Date(a.t)).slice(0, 8);
      document.getElementById("log").innerHTML = ev.map((e) => `<li><time>${hm(new Date(e.t))}</time>${e.h}</li>`).join("") || `<li>아직 기록이 없어요</li>`;
      document.getElementById("sub").textContent = demo
        ? "예시 · 6명이 둘러앉아 오후 2시까지 모은 모습 (예시 데이터)"
        : `${room.repo} · 둘러앉아 각자 만들고, 가운데로 모아요`;
    }

    render();
    if (!PIXEL.isDemo()) setInterval(render, 60000);
  </script>
</body>
</html>
