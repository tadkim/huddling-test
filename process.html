<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2팀 오늘의 흐름</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <style>
    /* 오늘의 흐름 — 조장만 수정 */
    body { font-family: var(--font-pixel); background: var(--pixel-wall); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: var(--space-4) var(--space-3) var(--space-5); display: grid; gap: var(--space-4); }
    .top { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; justify-content: space-between; }
    .top h1 { margin: 0; font-size: var(--text-xl); }
    .top p { margin: var(--space-1) 0 0; color: var(--color-text-muted); font-size: var(--text-sm); }
    .nav { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .chip { display: inline-block; padding: 6px 12px; border: 2px solid var(--pixel-ink); background: var(--pixel-white);
      color: var(--pixel-ink); text-decoration: none; font-size: var(--text-sm); box-shadow: 3px 3px 0 var(--pixel-ink); }
    .chip.on { background: var(--pixel-ink); color: var(--pixel-white); }

    .panel { background: var(--pixel-white); border: 4px solid var(--pixel-ink); box-shadow: 6px 6px 0 var(--pixel-ink); padding: var(--space-4); }
    .panel h2 { margin: 0 0 var(--space-3); font-size: var(--text-lg); }
    .panel h2 small { font-size: var(--text-sm); color: var(--color-text-muted); font-weight: 400; margin-left: 8px; }

    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-3); }
    @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .stat { border: 2px solid var(--pixel-ink); padding: 10px 12px; background: var(--pixel-floor-1); }
    .stat span { display: block; font-size: 12px; color: var(--color-text-muted); }
    .stat b { font-size: var(--text-xl); }
    .stat em { font-style: normal; font-size: 12px; color: var(--color-text-muted); }

    .queue { display: flex; align-items: flex-end; gap: var(--space-3); overflow-x: auto; padding: var(--space-2) 0; min-height: 120px; }
    .lead-desk { flex: none; display: grid; justify-items: center; gap: 4px; padding-right: var(--space-3); border-right: 2px dashed var(--pixel-wall-line); }
    .lead-desk .desk { width: 96px; height: 28px; background: var(--pixel-desk); border: 3px solid var(--pixel-ink); box-shadow: inset 0 -6px 0 var(--pixel-desk-dark); }
    .lead-desk span, .waiter span { font-size: 12px; color: var(--color-text-muted); text-align: center; }
    .waiter { flex: none; display: grid; justify-items: center; gap: 4px; width: 112px; }
    .waiter canvas { image-rendering: pixelated; width: 48px; height: 48px; animation: bob 1.2s steps(2) infinite; }
    .paper { background: var(--pixel-white); border: 2px solid var(--pixel-ink); padding: 4px 6px; font-size: 11px; line-height: 1.35; text-align: center; width: 100%; }
    .paper b { display: block; font-size: 12px; }
    .waiter .long { color: var(--status-stuck); }
    @keyframes bob { 50% { transform: translateY(-3px); } }
    .empty { color: var(--color-text-muted); font-size: var(--text-sm); }

    .lanes { display: grid; gap: 6px; }
    .lane { display: grid; grid-template-columns: 148px 1fr; align-items: center; gap: var(--space-2); }
    .who { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); min-width: 0; }
    .who canvas { image-rendering: pixelated; width: 32px; height: 32px; flex: none; }
    .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track { position: relative; height: 34px; background:
      repeating-linear-gradient(90deg, var(--pixel-floor-1) 0 1px, transparent 1px 100%); border: 2px solid var(--pixel-ink); background-color: var(--pixel-floor-2); }
    .mark { position: absolute; top: 50%; transform: translate(-50%, -50%); }
    .m-commit { width: 10px; height: 10px; background: var(--pixel-ink); }
    .m-commit.ai { background: var(--status-work); outline: 2px solid var(--pixel-ink); }
    .m-pr { width: 14px; height: 18px; background: var(--pixel-white); border: 2px solid var(--pixel-ink); }
    .m-merge { width: 16px; height: 16px; background: var(--status-done); border: 2px solid var(--pixel-ink); transform: translate(-50%, -50%) rotate(45deg); }
    .m-wait { position: absolute; top: 50%; height: 4px; margin-top: -2px; background: var(--status-stuck); opacity: .6; }
    .m-wait.done { background: var(--status-done); opacity: .35; }
    .axis { display: grid; grid-template-columns: 148px 1fr; gap: var(--space-2); }
    .ticks { position: relative; height: 18px; font-size: 11px; color: var(--color-text-muted); }
    .ticks span { position: absolute; transform: translateX(-50%); }
    .legend { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-3); font-size: 12px; color: var(--color-text-muted); align-items: center; }
    .legend i { display: inline-block; position: relative; vertical-align: middle; margin-right: 4px; }
    .legend .m-commit, .legend .m-pr, .legend .m-merge { position: static; transform: none; }
    .legend .m-merge { transform: rotate(45deg); width: 12px; height: 12px; }

    .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 360px; overflow: auto; }
    .log li { display: grid; grid-template-columns: 56px 1fr; gap: var(--space-2); font-size: var(--text-sm); padding: 6px 0; border-bottom: 1px solid var(--pixel-wall); }
    .log time { color: var(--color-text-muted); }
    .tag { font-size: 11px; padding: 0 5px; margin-left: 4px; color: var(--pixel-white); background: var(--status-work); }
    .note { font-size: 12px; color: var(--color-text-muted); }
    .error { color: var(--status-stuck); font-size: var(--text-sm); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>오늘의 흐름</h1>
        <p id="sub">GitHub 기록으로 보는 우리 조의 하루</p>
      </div>
      <nav class="nav">
        <a class="chip" href="index.html" id="tab-room">← 작업실</a>
        <a class="chip" href="huddle.html" id="tab-huddle">허들</a>
        <a class="chip on" href="process.html" id="tab-real">지금 흐름</a>
        <a class="chip" href="process.html?demo" id="tab-demo">하루 예시</a>
      </nav>
    </header>

    <section class="panel"><div class="stats" id="stats"></div></section>

    <section class="panel">
      <h2>조장 책상 앞 줄 <small>merge를 기다리는 PR</small></h2>
      <div class="queue" id="queue"></div>
    </section>

    <section class="panel">
      <h2>사람별 하루 <small id="range"></small></h2>
      <div class="axis"><span></span><div class="ticks" id="ticks"></div></div>
      <div class="lanes" id="lanes"></div>
      <div class="legend">
        <span><i class="m-commit"></i>커밋</span>
        <span><i class="m-commit ai"></i>Claude와 함께 쓴 커밋</span>
        <span><i class="m-pr"></i>PR 올림</span>
        <span><i class="m-merge"></i>merge됨</span>
        <span><i class="m-wait" style="position:static;display:inline-block;width:24px;margin:0"></i>기다린 시간</span>
      </div>
    </section>

    <section class="panel">
      <h2>일어난 일 <small>최신순</small></h2>
      <ul class="log" id="log"></ul>
    </section>

    <p class="note" id="note"></p>
  </div>

  <script src="shared/pixel.js"></script>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const hm = (d) => d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
    const mins = (a, b) => Math.max(0, Math.round((b - a) / 60000));
    const dur = (m) => (m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간 ${m % 60}분`);

    let last = null;

    async function render() {
      const demo = PIXEL.isDemo();
      document.getElementById("tab-real").classList.toggle("on", !demo);
      document.getElementById("tab-demo").classList.toggle("on", demo);
      document.getElementById("tab-room").href = demo ? "index.html?demo" : "index.html";
      document.getElementById("tab-huddle").href = demo ? "huddle.html?demo" : "huddle.html";

      let room, data;
      try {
        room = await PIXEL.loadRoom("", demo);
        data = await PIXEL.loadFlow(room.repo, demo);
        last = { room, data };
      } catch (e) {
        document.getElementById("note").innerHTML = `<span class="error">${esc(e.message)}</span>`;
        if (!last) return;
        ({ room, data } = last);
      }

      const now = new Date(data.now);
      const meOf = Object.fromEntries(room.seats.filter((s) => s.id).map((s) => [s.id.toLowerCase(), s.me]));
      const nameOf = (login) => (meOf[login.toLowerCase()] && meOf[login.toLowerCase()].name) || login;

      // 오늘 기록만. 오늘 기록이 없으면 전체를 보여줌
      const isToday = (iso) => new Date(iso).toDateString() === now.toDateString();
      let commits = data.commits, pulls = data.pulls, scope = "오늘";
      if (!commits.some((c) => isToday(c.at)) && !pulls.some((p) => isToday(p.created_at))) scope = "전체 (오늘 기록 없음)";
      else { commits = commits.filter((c) => isToday(c.at)); pulls = pulls.filter((p) => isToday(p.created_at) || (p.merged_at && isToday(p.merged_at))); }

      // 사람 순서: 자리 순서 → 자리 없는 사람
      const seatIds = room.seats.map((s) => s.id).filter(Boolean);
      const active = new Set([...commits.map((c) => c.login), ...pulls.map((p) => p.login)]);
      const people = [...seatIds, ...[...active].filter((l) => !seatIds.some((id) => id.toLowerCase() === l.toLowerCase()))];
      const arrived = seatIds.filter((id) => [...active].some((l) => l.toLowerCase() === id.toLowerCase()));

      // 요약
      const open = pulls.filter((p) => !p.merged_at && p.state !== "closed").sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      const merged = pulls.filter((p) => p.merged_at);
      const ai = commits.filter((c) => c.claude).length;
      const waits = merged.map((p) => mins(new Date(p.created_at), new Date(p.merged_at)));
      const avgWait = waits.length ? Math.round(waits.reduce((a, b) => a + b, 0) / waits.length) : null;
      document.getElementById("stats").innerHTML = [
        ["출근", `${arrived.length}/${seatIds.length}`, "커밋이나 PR을 남긴 사람"],
        ["줄 선 PR", open.length, open.length ? `가장 오래 ${dur(mins(new Date(open[0].created_at), now))}` : "대기 없음"],
        ["merge", merged.length, avgWait === null ? "-" : `평균 ${dur(avgWait)} 기다림`],
        ["Claude 동행", commits.length ? `${Math.round((ai / commits.length) * 100)}%` : "-", `커밋 ${commits.length}개 중 ${ai}개`],
        ["마지막 merge", merged.length ? hm(new Date(merged.map((p) => p.merged_at).sort().pop())) : "-", "이후 pull 받기"]
      ].map(([k, v, e]) => `<div class="stat"><span>${k}</span><b>${v}</b><br><em>${e}</em></div>`).join("");

      // 줄
      const q = document.getElementById("queue");
      q.innerHTML = `<div class="lead-desk"><div class="desk"></div><span>조장 책상</span></div>` + (open.length
        ? open.map((p) => { const m = mins(new Date(p.created_at), now);
            return `<div class="waiter"><div class="paper"><b>#${p.number}</b>${esc(p.title.slice(0, 22))}</div><canvas data-login="${esc(p.login)}"></canvas>
              <span class="${m >= 20 ? "long" : ""}">${esc(nameOf(p.login))} · ${dur(m)}째</span></div>`; }).join("")
        : `<span class="empty">줄 선 사람 없음. 조장이 빠르네요</span>`);
      q.querySelectorAll("canvas[data-login]").forEach((c) => { const me = meOf[c.dataset.login.toLowerCase()];
        PIXEL.draw(c, PIXEL.spriteOf(me).rows, PIXEL.colorsFor(me), 3, !me); });

      // 타임라인
      const times = [...commits.map((c) => +new Date(c.at)), ...pulls.map((p) => +new Date(p.created_at)), ...merged.map((p) => +new Date(p.merged_at))];
      let t0 = times.length ? Math.min(...times) : +now - 3600000, t1 = Math.max(+now, ...times);
      t0 -= 5 * 60000; if (t1 - t0 < 3600000) t0 = t1 - 3600000;
      const x = (iso) => `${(((+new Date(iso)) - t0) / (t1 - t0)) * 100}%`;
      document.getElementById("range").textContent = `${scope} · ${hm(new Date(t0))} ~ ${hm(new Date(t1))}`;
      const step = (t1 - t0) > 6 * 3600000 ? 3600000 : 30 * 60000;
      let ticks = ""; for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) ticks += `<span style="left:${((t - t0) / (t1 - t0)) * 100}%">${hm(new Date(t))}</span>`;
      document.getElementById("ticks").innerHTML = ticks;

      const lanes = document.getElementById("lanes");
      lanes.innerHTML = people.map((login) => {
        const L = login.toLowerCase();
        const mine = commits.filter((c) => c.login.toLowerCase() === L);
        const prs = pulls.filter((p) => p.login.toLowerCase() === L);
        const marks = [
          ...prs.map((p) => `<span class="m-wait ${p.merged_at ? "done" : ""}" style="left:${x(p.created_at)};width:calc(${x(p.merged_at || now.toISOString())} - ${x(p.created_at)})"></span>`),
          ...mine.map((c) => `<span class="mark m-commit ${c.claude ? "ai" : ""}" style="left:${x(c.at)}" title="${hm(new Date(c.at))} ${esc(c.msg)}"></span>`),
          ...prs.map((p) => `<span class="mark m-pr" style="left:${x(p.created_at)}" title="#${p.number} ${esc(p.title)}"></span>`),
          ...prs.filter((p) => p.merged_at).map((p) => `<span class="mark m-merge" style="left:${x(p.merged_at)}" title="#${p.number} merge"></span>`)
        ].join("");
        return `<div class="lane"><div class="who"><canvas data-login="${esc(login)}"></canvas><b>${esc(nameOf(login))}</b></div><div class="track">${marks}</div></div>`;
      }).join("") || `<span class="empty">아직 기록이 없어요</span>`;
      lanes.querySelectorAll("canvas[data-login]").forEach((c) => { const me = meOf[c.dataset.login.toLowerCase()];
        PIXEL.draw(c, PIXEL.spriteOf(me).rows, PIXEL.colorsFor(me), 2, !me); });

      // 로그
      const ev = [
        ...commits.map((c) => ({ t: c.at, h: `<b>${esc(nameOf(c.login))}</b> 커밋 “${esc(c.msg)}”${c.claude ? `<span class="tag">Claude</span>` : ""}` })),
        ...pulls.map((p) => ({ t: p.created_at, h: `<b>${esc(nameOf(p.login))}</b> PR #${p.number} 올림 · ${esc(p.title)}` })),
        ...merged.map((p) => ({ t: p.merged_at, h: `PR #${p.number} merge · <b>${esc(nameOf(p.login))}</b>의 작업이 main에 들어감 (${dur(mins(new Date(p.created_at), new Date(p.merged_at)))} 기다림)` }))
      ].sort((a, b) => new Date(b.t) - new Date(a.t));
      document.getElementById("log").innerHTML = ev.map((e) => `<li><time>${hm(new Date(e.t))}</time><span>${e.h}</span></li>`).join("") || `<li><span class="empty">아직 기록이 없어요</span></li>`;

      document.getElementById("sub").textContent = demo ? "하루 예시 · 11:40 ~ 14:00 (예시 데이터)" : `${room.repo} · GitHub 기록으로 보는 우리 조의 하루`;
      document.getElementById("note").textContent = demo
        ? "예시 데이터예요. 실제 화면은 '지금 흐름'에서 GitHub 기록으로 그려요."
        : `GitHub 공개 API · ${hm(new Date())} 갱신 · 60초마다 다시 불러와요 (로그인 없이 시간당 60번 한도)`;
    }

    render();
    if (!PIXEL.isDemo()) setInterval(render, 60000);
  </script>
</body>
</html>
